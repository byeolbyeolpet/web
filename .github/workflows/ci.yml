name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # lint보다 먼저 둔다. 포맷은 가장 싸게 떨어지는 검사고, 여기가 비어 있어서
      # #17에서 깨진 포맷 2건이 초록불로 통과했다(#19에서 발견).
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test
      # next build가 TypeScript 체크까지 수행하므로 별도 typecheck 단계는 두지 않는다
      # (standalone tsc는 .next/types 생성 전이라 라우트 타입 헬퍼를 못 찾음).
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # playwright webServer가 build + out/ 정적 서빙까지 수행한다.
      - run: npm run test:e2e
