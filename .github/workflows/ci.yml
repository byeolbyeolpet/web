name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # lint보다 먼저 둔다. 포맷은 가장 싸게 떨어지는 검사고, 여기가 비어 있어서
      # #17에서 깨진 포맷 2건이 초록불로 통과했다(#19에서 발견).
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test
      # next build가 TypeScript 체크까지 수행하므로 별도 typecheck 단계는 두지 않는다
      # (standalone tsc는 .next/types 생성 전이라 라우트 타입 헬퍼를 못 찾음).
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    # NEXT_PUBLIC_* 는 빌드 시점에 번들로 인라인된다. 없으면 useSession 의
    # getSession 이 영원히 로딩에 갇혀 로그인 화면이 렌더되지 않는다 —
    # 로컬은 .env.local 이 채우지만 CI 는 repo Actions 변수에서 받는다.
    # (둘 다 앱 번들에 그대로 실리는 공개 설계값이라 secret 이 아니다.)
    # 인증 E2E 계정(E2E_USER_*)은 CI 에 넣지 않는다 — authenticated 프로젝트는
    # 자격증명이 없으면 사유를 남기고 건너뛰도록 설계돼 있다(e2e/auth-config.ts).
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      # 카카오 JS 키 — 도메인 등록으로 보호되는 공개 설계값. E2E 가 localhost:3000
      # (등록 도메인)에서 SDK 실로드를 검증한다(#48).
      NEXT_PUBLIC_KAKAO_MAP_KEY: ${{ vars.NEXT_PUBLIC_KAKAO_MAP_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # playwright webServer가 build + out/ 정적 서빙까지 수행한다.
      - run: npm run test:e2e
