<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="별별펫">
  <!-- 바이올렛 스퀘어클 배경 -->
  <rect width="100" height="100" rx="24" fill="#6E56CF"/>
  <!-- 발자국 토우빈 4개 — 하나만 옅은 보라로 "별의별(다양함)" 액센트.
       브랜드 색 하나로만 구성해 크롬 무채색 체계와 어긋나지 않게 한다. -->
  <ellipse cx="28" cy="42" rx="8.5" ry="11" fill="#FFFFFF"/>
  <ellipse cx="41.5" cy="31" rx="8.5" ry="11.5" fill="#FFFFFF"/>
  <ellipse cx="58.5" cy="31" rx="8.5" ry="11.5" fill="#C4B5FD"/>
  <ellipse cx="72" cy="42" rx="8.5" ry="11" fill="#FFFFFF"/>
  <!-- 발바닥 메인 패드 -->
  <ellipse cx="50" cy="66" rx="19" ry="15.5" fill="#FFFFFF"/>
</svg>
